name: Data pipeline CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Clean the raw data
        run: python src/clean.py data/sample_transactions.csv output/clean_transactions.csv

      - name: Run data-quality checks
        run: python src/quality.py output/clean_transactions.csv

      - name: Upload cleaned data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-transactions
          path: output/clean_transactions.csv